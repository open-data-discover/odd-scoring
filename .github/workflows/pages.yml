name: Deploy Join Check to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: odd-scoring-pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.ODD_SCORING_SUPABASE_URL != '' && vars.ODD_SCORING_SUPABASE_KEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.ODD_SCORING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ODD_SCORING_SUPABASE_KEY }}
      - name: Verify Supabase leaderboard
        env:
          SUPABASE_URL: ${{ vars.ODD_SCORING_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.ODD_SCORING_SUPABASE_KEY }}
        run: |
          curl -fsS --retry 4 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            --data '{"action":"leaderboard"}' "${SUPABASE_URL%/}/rest/v1/rpc/odd_scoring_play" |
            jq -e '.top | type == "array"'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            if artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id')" &&
                [ -n "$artifact" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::GitHub Pages could not see the uploaded artifact"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
